[workspace]
resolver = "3"
members = ["cli", "e2e", "extension/native", "play-by-play"]

[workspace.package]
version = "1.0.0-alpha.20"

[workspace.lints.rust]
missing_docs = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
