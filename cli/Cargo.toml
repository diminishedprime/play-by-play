[package]
name = "play-by-play-cli"
version.workspace = true
edition = "2024"

[[bin]]
name = "play-by-play"
path = "src/main.rs"

[[bin]]
name = "pbp"
path = "src/bin/pbp.rs"

[dependencies]
bat = { version = "0.26.1", default-features = false, features = ["regex-fancy"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
comrak = { version = "0.59.0", default-features = false }
hex = "0.4.3"
memchr = "2.8.3"
memmap2 = "0.9.12"
notify = { version = "8.2.1", features = ["macos_kqueue"] }
play-by-play = { path = "../play-by-play" }
rustix = { version = "1.1.6", features = ["process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
terminal-colorsaurus = "1.0.3"
textwrap = { version = "0.16.4", default-features = false, features = ["unicode-width"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync"] }
tokio-stream = { version = "0.1.19", features = ["signal"] }

[lints]
workspace = true
