[package]
name = "play-by-play-e2e"
version = "1.0.0-alpha.4"
edition = "2024"
publish = false

[lints]
workspace = true

[dev-dependencies]
notify = { version = "8.2.1", features = ["macos_kqueue"] }
rustix = { version = "1.1.6", features = ["process", "pty", "termios"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "process", "time", "io-util", "fs", "sync"] }
