[package]
name = "play-by-play-e2e"
version.workspace = true
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
play-by-play = { path = "../play-by-play" }
rustix = { version = "1.1.6", features = ["process"] }
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "rt"] }

[dev-dependencies]
libc = "0.2.191"
notify = { version = "8.2.1", features = ["macos_kqueue"] }
prost = "0.14.4"
rustix = { version = "1.1.6", features = ["process", "pty", "termios"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "time", "io-util", "fs", "sync", "net", "signal"] }
vt100 = "0.18.1"
